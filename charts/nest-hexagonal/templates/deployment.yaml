{{- /*
@file charts/nest-hexagonal/templates/deployment.yaml

Deployment de la API NestJS con rolling update sin pérdida de servicio.

- La API no expone ruta de salud: las probes comprueban que el puerto acepta conexiones.
- La API cierra conexiones al recibir SIGTERM (`enableShutdownHooks`); el `preStop` de 5 s da
  tiempo a que Traefik y el Service dejen de enviarle tráfico antes.
- `JWT_SECRET` llega del Secret `existingSecret`; el resto de variables, de `env`.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nest.fullname" . }}
  labels:
    {{- include "nest.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "nest.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nest.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            - name: PORT
              value: {{ .Values.containerPort | quote }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: JWT_SECRET
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

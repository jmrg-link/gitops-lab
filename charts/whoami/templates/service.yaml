{{- /*
@file charts/whoami/templates/service.yaml

Service ClusterIP delante de los pods. Solo enruta a los que pasan la readiness; con el
`preStop` del Deployment, el cliente no nota el rolling update.

@example
  kubectl -n lab port-forward svc/lab-whoami 8082:80
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "whoami.fullname" . }}
  labels:
    {{- include "whoami.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "whoami.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http

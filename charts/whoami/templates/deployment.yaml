{{- /*
@file charts/whoami/templates/deployment.yaml

Deployment de la API con rolling update sin pérdida de servicio.

- Con `maxUnavailable: 0` y `maxSurge: 1`, Kubernetes crea un pod nuevo y solo retira uno
  viejo cuando el nuevo pasa la readiness.
- La readiness saca el pod del Service mientras no responde; la liveness lo reinicia si se cuelga.
- Un pod sale del Service a la vez que empieza a pararse, y whoami no gestiona SIGTERM.
  El `preStop` de 5 s retrasa la parada hasta que el Service ha dejado de enviarle tráfico.
- El contenedor corre sin root y sin escalada de privilegios.

@see https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#rolling-update-deployment
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "whoami.fullname" . }}
  labels:
    {{- include "whoami.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "whoami.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "whoami.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: whoami
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--port", "{{ .Values.containerPort }}", "--name", "{{ .Values.appName }}"]
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
